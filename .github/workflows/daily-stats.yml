name: Daily stats

# Collects yesterday's anonymous visitor counts per step from GoatCounter's public
# counter endpoints and appends them to daily.csv on the `stats` branch.
on:
  schedule:
    - cron: "17 2 * * *"   # 10:17 Asia/Shanghai
  workflow_dispatch:
    inputs:
      day:
        description: "Date to collect (YYYY-MM-DD). Empty = yesterday."
        required: false

permissions:
  contents: write

concurrency: daily-stats

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch origin stats:stats
            git worktree add ../stats stats
          else
            git worktree add --orphan -b stats ../stats
          fi

      - name: Collect
        run: python3 .github/scripts/collect_stats.py ../stats/daily.csv ${{ github.event.inputs.day }}

      - name: Commit
        working-directory: ../stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.csv
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "stats: $(tail -n 1 daily.csv | cut -d, -f1)"
          git push origin stats
